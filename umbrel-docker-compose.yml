services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      NODE_ENV: production
      PORT: 5000
    networks:
      default:
        ipv4_address: $APP_EXPENSE_TRACKER_BACKEND_IP
    dns:
      - 0.0.0.0

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - backend
    ports:
      - ${APP_EXPENSE_TRACKER_PORT}:80
    networks:
      default:
        ipv4_address: $APP_EXPENSE_TRACKER_FRONTEND_IP
    dns:
      - 0.0.0.0
