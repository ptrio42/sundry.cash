server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # "Remove this header or set non-informative values" — OWASP HTTP Security
    # Response Headers CS. Off drops the version, leaving a bare `nginx`.
    server_tokens off;

    # Allow receipt-photo uploads from phones (backend caps at 10MB; give headroom).
    client_max_body_size 12m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle React Router - serve index.html for all routes
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend.
    # `^~` makes this prefix win over the static-asset regex below, so image
    # endpoints like /api/receipts/<file>.jpg are proxied, not served as files.
    #
    # No security-headers include here on purpose: Express sets its own, and
    # nginx's add_header APPENDS — including it would send two CSP headers and
    # two HSTS headers on every API response. See security-headers.conf.
    location ^~ /api {
        proxy_pass http://backend:5000;

        # Receipt OCR is the one endpoint that can legitimately hold a request
        # for a minute or more: the engine loads ~10 MB of language data on the
        # first scan, then recognizes on this box's CPU. nginx's 60s default cut
        # that off and answered 504, which hid whatever the backend was about to
        # say. The backend's own ceilings (INIT_TIMEOUT_MS + RECOGNIZE_TIMEOUT_MS
        # in src/services/receipt/tesseract.ts) total 170s and must stay under
        # this number, so a stuck scan produces a real error instead of a 504.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The PWA icons are the one static set whose *bytes* change under a stable
    # filename — the manifest and <link rel="apple-touch-icon"> reference them by
    # path, so a rebrand cannot rename them the way a content hash would. Served
    # immutable for a year, the brand wave would have reached returning visitors
    # somewhere around next August. `^~` wins over the regex below.
    location ^~ /icons/ {
        # Re-included because this block's own add_header discards every header
        # inherited from the server context — nginx's rule, and the reason these
        # live in a snippet instead of being written once above.
        include /etc/nginx/snippets/security-headers.conf;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # Cache static assets. Everything left here is content-hashed by Vite (and
    # the fonts, whose bytes genuinely never change), so immutable is honest.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
