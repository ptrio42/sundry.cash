# Security response headers for the SPA.
#
# Included per-location rather than set once at server level, for two nginx
# reasons that both bite silently:
#   1. `add_header` in a location REPLACES everything inherited from the server
#      block, so the cache-control locations below would otherwise serve the app
#      with no security headers at all.
#   2. `location ^~ /api` deliberately does NOT include this file. Those
#      responses come from Express, which sets its own (stricter, JSON-shaped)
#      headers in backend/src/config/security.ts — and `add_header` appends, so
#      including it there would send two Content-Security-Policy headers and two
#      HSTS headers per response.
# `always` is required or the header is dropped on error responses.
#
# Values follow OWASP's HTTP Security Response Headers cheat sheet; deviations
# are named. The CSP is ours — that cheat sheet publishes no policy and defers
# to the CSP cheat sheet.

# --- Content-Security-Policy ------------------------------------------------
# Sundry is unusually well placed for a strict policy: no CDN, no external
# analytics, no web fonts, recharts bundled. So every source is 'self' and the
# only exceptions are the two inline blocks in index.html, allowed by hash
# rather than by opening the policy to inline script.
#
#   script-src   the hash is the anti-flash theme script, which must run before
#                first paint and therefore cannot move into the bundle (see the
#                comment in index.html). Vite copies both blocks into
#                dist/index.html byte-for-byte, so the hash of the source file
#                is the hash of the shipped file — and a Vitest case
#                (src/tests/csp.test.ts) recomputes it and fails if either
#                drifts. No 'unsafe-eval': the built bundle contains no eval and
#                no `new Function`.
#   style-src    same treatment for the anti-flash <style>.
#   style-src-attr  THE ONE EXCEPTION. React writes `style={{…}}` as a style
#                attribute and recharts positions every SVG element that way,
#                and CSP has no hash mechanism for attributes. Scoped to
#                -attr on purpose: inline <style> ELEMENTS stay hash-only, so an
#                injected <style> is still refused.
#   img-src      data: for the one SVG data-URI in the built stylesheet; blob:
#                for receipt photos, which are previewed with
#                URL.createObjectURL before upload and fetched with the bearer
#                token (not a plain <img src="/api/…">) afterwards.
#   connect-src  'self' only. The app calls /api and nothing else, ever — that
#                is the product's pitch, and here it is as a policy.
#   worker-src   the PWA service worker (public/sw.js), registered in main.tsx.
#   frame-ancestors 'none' obsoletes X-Frame-Options for supporting browsers;
#                the header below stays for the ones that predate it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-oZJg0X3F9EvE9KZHNC/ldSJFL3Z1+9ujK0yPIULLRTM='; style-src 'self' 'sha256-aRD3gXUEv3cL3TiSwwK0ThFBZiqKZvpj9k6wuf4qJAQ='; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

# --- The rest of the cheat sheet's list -------------------------------------
# HSTS: the published line is `max-age=63072000; includeSubDomains; preload`.
# We keep the two years and includeSubDomains and drop `preload` — our
# judgement: preloading is effectively irreversible and this is a self-hoster's
# own domain, which may serve other things over plain HTTP. Browsers ignore the
# header entirely on a non-secure origin, so a LAN install on http is unchanged.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# The sheet publishes strict-origin-when-cross-origin; no-referrer is stricter
# and costs us nothing, because nothing in this app links or fetches outward.
add_header Referrer-Policy "no-referrer" always;
# camera=() was omitted at first, unsure whether browsers gate the receipt-scan
# input (<input type="file" capture="environment">, ReceiptScan.tsx) behind the
# policy. Settled, and it is safe to deny: the 'camera' feature is defined as
# gating getUserMedia() only (MDN's camera directive page; the Media Capture and
# Streams spec is where the feature is registered), and HTML Media Capture — the
# spec for the capture attribute — contains no Permissions Policy integration
# point at all. Mechanically there is nothing to deny: the native picker runs
# the OS camera app and hands the page a finished file, never a camera stream.
# The app itself never calls getUserMedia (no hit in either package), so this
# costs the flagship flow nothing and stops injected script — should the CSP
# ever be weakened — from opening the camera.
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# The sheet publishes CORP `same-site`; same-origin is stricter and correct here
# because nothing else is meant to embed these files. COEP (`require-corp`) is
# deliberately absent: it buys cross-origin isolation this app has no use for —
# no SharedArrayBuffer, no cross-origin resources at all — and the sheet's own
# note is that it blocks resources that are not configured for it.
add_header Cross-Origin-Resource-Policy "same-origin" always;
