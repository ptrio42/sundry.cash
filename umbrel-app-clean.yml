manifestVersion: 1
id: expense-tracker
category: finance
name: Expense Tracker
version: "1.0.0"
tagline: Track your expenses locally with multi-currency support
description: >-
  A local expense tracking application with multi-currency support (USD, PLN).


  Features:

  - Multi-currency expense tracking (USD, PLN)

  - Excel import for bulk expense data

  - Auto-categorization with smart keyword detection

  - Bulk operations (select, delete, assign categories)

  - Analytics dashboard with charts and insights

  - Date range filtering and search

  - All data stays on your device - no internet connectivity


  Perfect for personal finance management without cloud dependencies.
