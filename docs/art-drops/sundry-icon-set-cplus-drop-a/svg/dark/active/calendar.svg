    <rect x="7" y="10.2" width="10" height="1.7" rx=".85" fill="black"/>
    <rect x="7" y="14.1" width="3.2" height="2.7" rx=".6" fill="black"/>
    <rect x="11.4" y="14.1" width="2.4" height="2.7" rx=".6" fill="black"/>

