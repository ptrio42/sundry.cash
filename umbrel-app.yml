manifestVersion: 1
id: sundry
category: finance
name: Sundry
version: "1.0.0"
tagline: Track your expenses locally with multi-currency support
description: >-
  A local expense tracking application with multi-currency support (USD, PLN).


  Features:

  - Multi-currency expense tracking (USD, PLN)

  - Excel import for bulk expense data

  - Auto-categorization with smart keyword detection

  - Bulk operations (select, delete, assign categories)

  - Analytics dashboard with charts and insights

  - Date range filtering and search

  - All data stays on your device - no internet connectivity


  Perfect for personal finance management without cloud dependencies.
developer: ptrio42
website: https://github.com/yourusername/sundry
dependencies: []
repo: https://github.com/yourusername/sundry
support: https://github.com/yourusername/sundry/issues
port: 8847
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
releaseNotes: >-
  Initial release:

  - Multi-currency expense tracking

  - Excel import functionality

  - Analytics and charts

  - Bulk operations support

  - LAN-only access (no internet connectivity)
submitter: ptrio42
submission: https://github.com/getumbrel/umbrel-apps

containers:
  - name: backend
    image: sundry-backend:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    stop_signal: SIGTERM
    networks:
      default:
        ipv4_address: $APP_EXPENSE_TRACKER_BACKEND_IP
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      NODE_ENV: production
      PORT: 5000
    dns:
      - 0.0.0.0

  - name: frontend
    image: sundry-frontend:1.0.0
    restart: on-failure
    stop_grace_period: 1m
    stop_signal: SIGTERM
    depends_on:
      - backend
    networks:
      default:
        ipv4_address: $APP_EXPENSE_TRACKER_FRONTEND_IP
    ports:
      - ${APP_EXPENSE_TRACKER_PORT}:80
    dns:
      - 0.0.0.0
