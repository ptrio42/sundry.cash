# Sundry — one instance = one user = one SQLite file.
#
# Every knob below has a default, so a plain `docker compose up --build` still
# does exactly what it did before this file learned about instances: containers
# named sundry-backend / sundry-frontend, data in ./data, the app on :8847.
#
# To run a second instance on the same host, give it its own project name, its
# own container-name prefix, its own port and its own data directory — all four,
# because `container_name` and a published port are absolute and would collide
# otherwise. That is what deploy/instance.env.example is for:
#
#   COMPOSE_PROJECT_NAME=acme docker compose --env-file deploy/acme.env up -d
#
# See deploy/README.md for the whole pattern, including the front proxy.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${INSTANCE:-sundry}-backend
    restart: unless-stopped
    volumes:
      # Persist the SQLite database and receipt images. Plain bind mount on
      # purpose: Docker creates ./data if it is missing, whereas a named volume
      # with `driver_opts: {type: none, o: bind}` fails on a fresh clone because
      # ./data is gitignored and therefore absent.
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Explicit rather than left to the app's `<cwd>/data/expenses.db` default,
      # which resolves to the same file: the nightly demo reset deletes this
      # path and re-seeds it, and a script guessing where the database lives is
      # how you delete the wrong one.
      - DB_PATH=${DB_PATH:-/app/data/expenses.db}
      # Unset means auth stays off — right for localhost, wrong for anything
      # with a public hostname. The empty default keeps that behaviour when no
      # env file is used; an instance file sets a real password.
      - APP_PASSWORD=${APP_PASSWORD:-}
      # Falls back to APP_PASSWORD when empty. Set it per instance so a leaked
      # token is not also an oracle for the password itself.
      - AUTH_SECRET=${AUTH_SECRET:-}
      # Turns the opt-in above into a requirement: with this true and no
      # password, the backend refuses to start and every guarded route answers
      # 503 instead of serving the ledger. Set it on anything with a public
      # hostname; leave it false for a laptop.
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      # Proxies in front of the backend that append to X-Forwarded-For. 1 is
      # this compose file (the bundled nginx). 2 if a front proxy such as Caddy
      # or Fly sits in front of that — otherwise the login limiter counts every
      # visitor as one address. See backend/src/config/security.ts.
      - TRUST_PROXY=${TRUST_PROXY:-1}
      # Cross-origin callers, comma-separated. Empty is correct here: nginx
      # serves the SPA on the same origin as /api, so nothing is cross-origin.
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Instance flags, reported publicly by GET /api/config. Orthogonal on
      # purpose: a demo is not automatically read-only, and an instance with
      # uploads off is not automatically a demo.
      - DEMO_MODE=${DEMO_MODE:-false}
      - RECEIPTS_ENABLED=${RECEIPTS_ENABLED:-true}
    networks:
      - expense-network
    # NOTE: the previous `dns: 0.0.0.0` "no internet" hack was removed — it also
    # blocked Docker's embedded DNS, so nginx could no longer resolve the `backend`
    # service name and the app failed to start. For a real no-egress posture, put
    # the backend on a dedicated `internal: true` network instead (see docs/DEPLOYMENT.md).
    # Only expose to internal network, not to host
    expose:
      - "5000"
    healthcheck:
      # 127.0.0.1 rather than localhost — see the frontend's healthcheck below
      # for why. This one would pass either way, but only by luck: Node's
      # `app.listen(PORT)` with no host binds dual-stack (`:::5000`), so ::1
      # answers. Pinning the host would break it exactly as it broke nginx.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${INSTANCE:-sundry}-frontend
    restart: unless-stopped
    ports:
      # Published on all interfaces by default, which is what a home-LAN install
      # wants. An instance sitting behind the front proxy sets BIND_ADDR=127.0.0.1
      # so the only way in is through Caddy and its certificate — otherwise every
      # customer instance is also reachable on a bare port over plain HTTP.
      - "${BIND_ADDR:-0.0.0.0}:${HTTP_PORT:-8847}:80"
    depends_on:
      - backend
    networks:
      - expense-network
    # NOTE: the previous `dns: 0.0.0.0` "no internet" hack was removed — it also
    # blocked Docker's embedded DNS, so nginx could no longer resolve the `backend`
    # service name and the app failed to start. For a real no-egress posture, put
    # the backend on a dedicated `internal: true` network instead (see docs/DEPLOYMENT.md).
    healthcheck:
      # 127.0.0.1, never localhost: busybox wget resolves `localhost` to [::1]
      # first, and nginx listens on IPv4 only (frontend/nginx.conf), so this
      # probe collected "Connection refused" forever and the container sat
      # `unhealthy` while serving the app perfectly. That matters beyond the
      # word: `depends_on` and any `--wait` or orchestrator gate reads it, so a
      # healthy deploy rolls back.
      #
      # The other repair — `listen [::]:80` in nginx.conf — was rejected. This
      # network declares no `enable_ipv6`, so the container's only IPv6 address
      # is ::1 on `lo` (eth0 is IPv4-only) and that listener would serve nobody
      # but this probe, while leaving it resolver-dependent about which stack it
      # tested. Name the address the traffic actually uses instead: Docker
      # publishes to the container's IPv4 address, and deploy/Caddyfile
      # reverse-proxies to 127.0.0.1. If this ever needs to answer over IPv6,
      # that is an addressable network plus the nginx listen, together.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  expense-network:
    driver: bridge
    internal: false  # allow LAN access to the published frontend port
    # No `ipam` subnet on purpose: nothing here needs fixed addressing, and a
    # hardcoded 172.28.0.0/16 can collide with a VPN or another Compose stack.
    # The network is named per project, so two instances never share one.
